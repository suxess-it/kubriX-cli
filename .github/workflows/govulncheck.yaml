name: Check for known vulnerabilities

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # New vulnerabilities are published without any change here; check main weekly.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "~1.26"
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      # Fails when the code reaches a known vulnerable symbol, in a module or in the Go standard library.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
